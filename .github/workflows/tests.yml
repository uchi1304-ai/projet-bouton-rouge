
name: CI/CD - Le Bouton Rouge

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  tests:
    name: CI - Tests Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Audit securite Backend
        run: npm audit --audit-level=high

      - name: Audit securite Frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Executer Jest avec couverture
        run: npm test -- --coverage --runInBand

  docker-build-push:
    name: CI/CD - Docker Build & Push
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Verifier Docker Compose
        run: docker compose -f compose.yaml config -q

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-backend:dev
            ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-backend:${{ github.sha }}

      - name: Build et Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:dev
            ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:${{ github.sha }}
