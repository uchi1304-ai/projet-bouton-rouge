
name: CI/CD - Le Bouton Rouge

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  tests:
    name: CI - Tests Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Audit securite Backend
        run: npm audit --audit-level=high

      - name: Audit securite Frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Executer Jest avec couverture
        run: npm test -- --coverage --runInBand



  gitleaks:
    name: CI - Detection des secrets
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code et son historique
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  docker-build-push:
    name: CI/CD - Docker Build, Trivy & Push
    runs-on: ubuntu-latest
    needs: [tests, gitleaks]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Verifier Docker Compose
        run: docker compose -f compose.yaml config -q

      # Construir las imagenes LOCALMENTE en GitHub Actions
      - name: Build Backend
        run: docker build -t bouton-backend:scan ./backend

      - name: Build Frontend
        run: docker build -t bouton-frontend:scan ./frontend

      # Analizar el backend ANTES de publicarlo
      - name: Trivy - Scanner Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: bouton-backend:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
          version: v0.76.1

      # Analizar el frontend ANTES de publicarlo
      - name: Trivy - Scanner Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: bouton-frontend:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
          version: v0.76.1
          skip-setup-trivy: true

      # Solo se ejecuta si los dos analisis pasan
      - name: Connexion a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier Backend
        run: |
          docker tag bouton-backend:scan ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-backend:dev
          docker tag bouton-backend:scan ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-backend:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-backend:dev
          docker push ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-backend:${{ github.sha }}

      - name: Publier Frontend
        run: |
          docker tag bouton-frontend:scan ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:dev
          docker tag bouton-frontend:scan ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:dev
          docker push ${{ vars.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:${{ github.sha }}